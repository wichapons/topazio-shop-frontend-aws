version: 1
applications:
    frontend:
      phases:
        preBuild:
          commands:
            - pwd
            - npm install
        build:
          commands:
            - npm run build
            - echo "Current directory:"
            - pwd
            - echo "Directory contents:"
            - ls -la
            - echo "Build directory contents:"
            - ls -la dist
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    customHeaders:
      - pattern: '**/*.js'
        headers:
          - key: 'Content-Type'
            value: 'application/javascript'
      - pattern: '**/*.mjs'
        headers:
          - key: 'Content-Type'
            value: 'application/javascript'
    rewrites:
      - source: '/<*>'
        target: '/index.html'
        status: '200'